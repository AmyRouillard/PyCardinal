[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pycardinal"
version = "0.1.0"
description = "Python tools for mass spectrometry imaging data analysis"
readme = "README.md"
requires-python = ">=3.14"
license = "Artistic-2.0"
license-files = ["LICENSE"]
keywords = ["mass spectrometry imaging", "imaging mass spectrometry", "imzML"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]
authors = [{ name = "Amy Rouillard" }]
maintainers = [{ name = "Amy Rouillard" }]

dependencies = [
    "joblib>=1.3",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.1",
    "pyimzml>=1.5",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "statsmodels>=0.14",
]

[project.urls]
Documentation = "https://github.com/AmyRouillard/PyCardinal/tree/main/docs"
Repository = "https://github.com/AmyRouillard/PyCardinal"
Issues = "https://github.com/AmyRouillard/PyCardinal/issues"

[project.optional-dependencies]
dev = [
    "hypothesis>=6.98",
    "mypy>=1.8",
    "pandas-stubs>=2.1",
    "pytest>=8.0",
    "pytest-benchmark>=4.0",
    "ruff>=0.3",
    "scipy-stubs>=1.11",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.24",
]
packaging = [
    "build>=1.2",
    "twine>=5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
packages = ["pycardinal"]
strict = true