site_name: pycardinal
site_description: Python tools for mass spectrometry imaging data analysis

theme:
  name: readthedocs
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

nav:
  - Home: index.md
  - Installation & Testing: installation.md
  - API Reference: api-reference.md
  - Generated API: generated-api.md
  - Development: development.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            show_source: false
            show_root_heading: true
            members_order: source

